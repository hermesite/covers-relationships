info:
  name: Search master releases by artist and title
  type: http
  seq: 1
http:
  method: GET
  url: "https://api.discogs.com/database/search?artist={{artist}}&release_title={{album}}&type=master&page={{page}}&per_page={{perPage}}"
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Master candidates:", (res.body.results || []).map(function (master) {
          return { id: master.id, title: master.title, year: master.year, format: master.format };
        }));
settings:
  encodeUrl: true
  timeout: 30000