info:
  name: Artist biography members and photos
  type: http
  seq: 2
http:
  method: GET
  url: "https://api.discogs.com/artists/{{artistId}}"
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Artist image count:", (res.body.images || []).length);
        console.log("First artist image candidates:", (res.body.images || []).slice(0, 3).map(function (image) {
          return { type: image.type, uri: image.uri, uri150: image.uri150, width: image.width, height: image.height };
        }));
settings:
  encodeUrl: true
  timeout: 30000