info:
  name: Artist biography identifiers and image fields
  type: http
  seq: 1
http:
  method: GET
  url: "https://ws.audioscrobbler.com/2.0/?method=artist.getInfo&api_key={{process.env.LASTFM_API_KEY}}&format=json&artist={{artist}}&username={{user}}&autocorrect=1&lang={{lang}}"
runtime:
  scripts:
    - type: after-response
      code: |-
        const artist = res.body.artist;
        if (artist) {
          const images = (artist.image || []).filter(function (image) {
            return image["#text"] && !image["#text"].includes("2a96cbd8b46e442fc41c2b86b821562f");
          });
          console.log("Artist MBID:", artist.mbid || "not supplied");
          console.log("Non-placeholder artist image candidates:", images);
        }
settings:
  encodeUrl: true
  timeout: 30000