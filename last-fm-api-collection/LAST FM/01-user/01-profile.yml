info:
  name: User profile
  type: http
  seq: 1

http:
  method: GET
  url: "https://ws.audioscrobbler.com/2.0/?method=user.getInfo&api_key={{process.env.LASTFM_API_KEY}}&user={{user}}&format=json"
  params:
    - name: method
      value: user.getInfo
      type: query
    - name: api_key
      value: "{{process.env.LASTFM_API_KEY}}"
      type: query
    - name: user
      value: "{{user}}"
      type: query
    - name: format
      value: json
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("Last.fm request succeeds", function () {
          expect(res.status, res.body.message || "HTTP response").to.equal(200);
          expect(res.body.error).to.equal(undefined);
          expect(res.body.user.name.toLowerCase()).to.equal(bru.getCollectionVar("user").toLowerCase());
        });

settings:
  encodeUrl: true
  timeout: 30000