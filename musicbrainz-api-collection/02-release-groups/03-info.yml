info:
  name: Release group type genres editions and external links
  type: http
  seq: 3
http:
  method: GET
  url: "https://musicbrainz.org/ws/2/release-group/{{releaseGroupMbid}}?inc=artist-credits+releases+genres+tags+url-rels&fmt=json"
runtime:
  scripts:
    - type: after-response
      code: |-
        console.log("Release classification:", {
          title: res.body.title,
          primaryType: res.body["primary-type"],
          secondaryTypes: res.body["secondary-types"]
        });
settings:
  encodeUrl: true
  timeout: 30000