info:
  name: Artist metadata and relationships to all entity types
  type: http
  seq: 2
http:
  method: GET
  url: "https://musicbrainz.org/ws/2/artist/{{artistMbid}}?inc=aliases+genres+tags+area-rels+artist-rels+event-rels+genre-rels+instrument-rels+label-rels+place-rels+recording-rels+release-rels+release-group-rels+series-rels+url-rels+work-rels&fmt=json"
runtime:
  scripts:
    - type: after-response
      code: |-
        const relationships = res.body.relations || [];
        console.log("Relationship counts by target:", relationships.reduce(function (counts, relationship) {
          const targetType = relationship["target-type"];
          counts[targetType] = (counts[targetType] || 0) + 1;
          return counts;
        }, {}));
        console.log("External links:", relationships.filter(function (relation) {
          return relation["target-type"] === "url";
        }).map(function (relation) {
          return { type: relation.type, url: relation.url.resource };
        }));
    - type: tests
      code: |-
        test("Artist relationships are included", function () {
          expect(res.body.relations).to.be.an("array");
        });
settings:
  encodeUrl: true
  timeout: 30000